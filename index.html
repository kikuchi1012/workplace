<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <!-- 1. LIFF SDKの読み込みが必要です -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    async function main() {
      let googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfsLqddduemZ70qxTrSysQjN3mGAlKRvEMxzC4AzR8tdO4cOg/viewform?usp=pp_url';
      try {
        await liff.init({ liffId: "2009679948-qAAFdnlQ" }); // 自身のLIFF IDに書き換え
        if (!liff.isLoggedIn()) {
          liff.login();
          return; // ログイン画面へ飛ぶため、ここで処理を止める
        } else {
        const profile = await liff.getProfile();
        const userId = profile.userId;
        const displayName = profile.displayName;

        const url = "https://script.google.com/macros/s/AKfycbzRhOGPCanCA6dq98QSLGyvOLHjy_Rhs1XTlFF_Yc3qFgKmzwFTdVS9v4GSJbUaveU1jA/exec";
        const sendData = {
          userId: userId,
          userName: displayName
        };

        fetch(url, {
          method: "POST",
          body: JSON.stringify(sendData)
        })
        .then(response => response.json())
        .then(result => console.log("送信成功:", result))
        .catch(error => console.error("エラー:", error));

        // URLパラメータから流入元を取得（例: ?from=menuA）
        const urlParams = new URLSearchParams(window.location.search);
//        const source = urlParams.get('from') || 'unknown';
        const source = urlParams.get('from');

       // Googleフォームの事前入力URL
        // フォーム側で「事前入力項目」を追加する（entry.xxx部分）
        // 
        if (source == '01_A') {         // ボタンA
          googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfrNUx8SL1090gq1joqcCSbowo3_lPm0Aj7WVBsQEXF4tib1A/viewform?usp=pp_url'
                         + '&entry.861173990=' + encodeURIComponent(userId)
                         + '&entry.369074701=' + encodeURIComponent(displayName);
        }
        if (source == '01_B') {         // ボタンB
         googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfsLqddduemZ70qxTrSysQjN3mGAlKRvEMxzC4AzR8tdO4cOg/viewform?usp=pp_url'
                        + '&entry.98540952=' + encodeURIComponent(userId);

        }
        if (source == '01_C') {         // ボタンC
         googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfsLqddduemZ70qxTrSysQjN3mGAlKRvEMxzC4AzR8tdO4cOg/viewform?usp=pp_url'
                        + '&entry.98540952=' + encodeURIComponent(userId);

        }
      }  
        window.location.href = googleFormUrl;
          
      } catch (error) {
        console.error("LIFF Error:", error);
      }
    }
    // ページ読み込み完了後に実行
    window.addEventListener('load', main);
  </script>
</head> 
  <body>Redirecting to Google Form...  20</body>
</html>
