<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <!-- 1. LIFF SDKの読み込みが必要です -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    async function main() {
      try {
        await liff.init({ liffId: "2009679948-qAAFdnlQ" }); // 自身のLIFF IDに書き換え
        if (!liff.isLoggedIn()) {
          liff.login();
          return; // ログイン画面へ飛ぶため、ここで処理を止める
        } else {
        const profile = await liff.getProfile();
        const userId = profile.userId;
        const displayName = profile.displayName;

        // URLパラメータから流入元を取得（例: ?from=menuA）
        const urlParams = new URLSearchParams(window.location.search);
        const source = urlParams.get('from') || 'unknown';
        let googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfsLqddduemZ70qxTrSysQjN3mGAlKRvEMxzC4AzR8tdO4cOg/viewform?usp=pp_url';

    
        if (source == '01_A') {         // ボタンA
        // Googleフォームの事前入力URL
        // フォーム側で「事前入力項目」を追加する（entry.xxx部分）
        // 
          googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSf_1UQRb3gUAARuNqPv0OD0lVw1F1SPZluzK1LCdlie9fSYrA/viewform?usp=pp_url'
                         + '&entry.98540952=' + encodeURIComponent(userId)
                         + '&entry.821234169=' + encodeURIComponent(displayName)
                         + '&entry.1076542200=' + encodeURIComponent(source);
        }
        if (source == '01_B') {         // ボタンB
        // Googleフォームの事前入力URL
        // フォーム側で「事前入力項目」を追加する（entry.xxx部分）
         googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfsLqddduemZ70qxTrSysQjN3mGAlKRvEMxzC4AzR8tdO4cOg/viewform?usp=pp_url'
                        + '&entry.98540952=' + encodeURIComponent(userId)
                        + '&entry.821234169=' + encodeURIComponent(displayName)
                        + '&entry.1076542200=' + encodeURIComponent(source);

        }
      }  
        window.location.href = googleFormUrl;
          
      } catch (error) {
        console.error("LIFF Error:", error);
      }
    }
    // ページ読み込み完了後に実行
    window.addEventListener('load', main);
  </script>
</head> 
  <body>Redirecting to Google Form...</body>
</html>
