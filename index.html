    async function main() {
      let googleFormUrl; // GoogleフォームのURLを格納する変数

      try {
        await liff.init({ liffId: "2009679948-qAAFdnlQ" }); // 自身のLIFF IDに書き換え
        if (!liff.isLoggedIn()) {
          liff.login();
          return; // ログイン画面へ飛ぶため、ここで処理を止める
        } else {
          const profile = await liff.getProfile();
          const userId = profile.userId;
          const displayName = profile.displayName;

          // URLパラメータから流入元を取得（例: ?from=menuA）
          const urlParams = new URLSearchParams(window.location.search);
//        const source = urlParams.get('from') || 'unknown';
          const source = urlParams.get('from');

          const url = "https://script.google.com/macros/s/AKfycbzkqUWuWfyy4WUnbFU42TduPabtkWzo_vwvwsCioausJ2zNmambYZOiJ4utDljZO8WeSA/exec";

          const sendData = {
            userId: userId,
            userName: displayName,
            source: source
          };
          let src1 = source.split('_')[0];
          let src2 = source.split('_')[1];
              src2 = 'X';

          let ValuesFM = getValuesFM();
          let shibu;
          let chiku;

          if(src2 === 'C' || src2 === 'D' || src2 === 'E' || src2 === 'F') { // 代理入力の場合のみGASにデータを送信してGoogleフォームのURLを生成
            const response = await fetch(url, {
              method: "POST",
              body: JSON.stringify(sendData),
            // リダイレクトを追跡する設定を追加

              mode: "cors"
            });

            let chiku = data.chiku;
            let ms00 = data.ms00;

            let shibu_EP, chiku_EP;

            if(src2 === 'C') {

                            + ValuesFM[11][4] + encodeURIComponent(userId)
                            + ValuesFM[11][8] + encodeURIComponent(ms00);
            }
            if(src2 === 'D') {
              switch(src1) {

                case '01':

                case '02':

                    }

                case '03':

                  shibu_EP = ValuesCh03[1][4];
                  for(i=1;i<ValuesCh03.length;i++) {
                    if(ValuesCh03[i][2] == '地区（'+shibu+'支部・第３管区）') {
                      chiku_EP = ValuesCh03[i][4];
                      break;
                    }

                  break;

              googleFormUrl = ValuesFM[dd+3][3]
                            + shibu_EP + encodeURIComponent(shibu)
                            + chiku_EP + encodeURIComponent(chiku)
//                            + '&entry.664084233=' + encodeURIComponent(shibu)
//                            + '&entry.1142622364=' + encodeURIComponent(chiku)

                            + ValuesFM[no][7] + encodeURIComponent(userId);

             // 代理入力以外はURLパラメータから流入元を取得してGoogleフォームのURLを生成
              googleFormUrl = getgoogleFormUrl(ValuesFM, userId, displayName, source);

              console.log("生成されたGoogleフォームのURL:", googleFormUrl);
            }

        }

    function getgoogleFormUrl(ValuesFM, userId, displayName, source) {
        let src1 = source.split('_')[0];
        let src2 = source.split('_')[1];
        switch(src2) {
          case 'A':
            switch(src1) {
              case '01':
                googleFormUrl = ValuesFM[1][3]
                              + ValuesFM[1][4] + encodeURIComponent(userId)
                              + ValuesFM[1][5] + encodeURIComponent(displayName);
                break
              case '02':
                googleFormUrl = ValuesFM[2][3]
                              + ValuesFM[2][4] + encodeURIComponent(userId)
                              + ValuesFM[2][5] + encodeURIComponent(displayName);
                break;
              case '03':
                googleFormUrl = ValuesFM[3][3]
                              + ValuesFM[3][4] + encodeURIComponent(userId)
                              + ValuesFM[3][5] + encodeURIComponent(displayName);
                break;
              default:
                break;
            }
            break;
          case 'B':
            googleFormUrl = ValuesFM[7][3]
                          + ValuesFM[7][4] + encodeURIComponent(userId);
            switch(src1) {
              case '01':
                googleFormUrl = ValuesFM[7][3]
                              + ValuesFM[7][4] + encodeURIComponent(userId);
                break
              case '02':
                googleFormUrl = ValuesFM[8][3]
                              + ValuesFM[8][4] + encodeURIComponent(userId);
                break;
              case '03':
                googleFormUrl = ValuesFM[9][3]
                              + ValuesFM[9][4] + encodeURIComponent(userId);
                break;
              default:
                break;
            }
            break;
          case 'C':
            googleFormUrl = ValuesFM[10][3]
                          + ValuesFM[10][4] + encodeURIComponent(userId);
            break;
          case 'D':
            switch(src1) {
              case '01':
                googleFormUrl = ValuesFM[4][3]
                              + ValuesFM[4][4] + encodeURIComponent(userId)
                              + ValuesFM[4][7] + encodeURIComponent(userId);
                break
              case '02':
                googleFormUrl = ValuesFM[5][3]
                              + ValuesFM[5][4] + encodeURIComponent(userId)
                              + ValuesFM[5][7] + encodeURIComponent(userId);
                break;
              case '03':
                googleFormUrl = ValuesFM[6][3]
                              + ValuesFM[6][4] + encodeURIComponent(userId)
                              + ValuesFM[6][7] + encodeURIComponent(userId);
                break;
              default:
                break;
            }
            break;
          case 'F':
            googleFormUrl = ValuesFM[11][3]
                          + ValuesFM[11][4] + encodeURIComponent(userId);
            break;
          default:
        }
// ここにGoogle FormのURLを生成するロジックを記述
        return googleFormUrl;          
    }
