
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハナサクカウンター</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    input[type="number"] { padding: 10px; font-size: 16px; width: 80px; text-align: center; }
    button { padding: 10px 20px; font-size: 16px; background-color: #06C755; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .video-container { margin-top: 20px; max-width: 100%; }
    video { width: 100%; max-width: 500px; border: 1px solid #ccc; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>ハナサクカウント v.005</h2>

  <div class="form-group">
    <!-- 数字入力を受け付ける -->
    <input type="number" id="videoNumber" min="1" max="3" placeholder="1〜3">
    <button onclick="changeVideo()">動画を再生</button>
  </div>

  <!-- 動画表示エリア（初期状態は非表示、またはポスター画像を指定） -->
  <div class="video-container">
<!--    <video id="myPlayer" controls playsinline>-->
    <video id="myPlayer" playsinline muted autoplay>
      <source id="videoSource" src="" type="video/mp4">
      お使いのブラウザは動画タグをサポートしていません。
    </video>
  </div>

  <!-- LINE LIFF SDK の読み込み -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // LIFFの初期化（必要に応じて初期化処理を記述）
    liff.init({ liffId: "2009672858-Ns5BWHE9" })
      .then(() => { console.log("LIFF initialized"); })
      .catch((err) => { console.error("LIFF init failed", err); });

    // 数字と動画URLの対応表（マッピングテーブル）
    const videoList = {
      1: "https://kikuchi1012.github.io/my-liff-data/hanasaku_video.mp4",
      2: "https://kikuchi1012.github.io/my-liff-data/hanasaku_video.mp4",
      3: "https://kikuchi1012.github.io/my-liff-data/hanasaku_video.mp4"
    };

    function changeVideo() {
      // 入力された数字を取得
      const num = document.getElementById("videoNumber").value;
      const player = document.getElementById("myPlayer");
      const source = document.getElementById("videoSource");

      // 対応する動画URLがあるかチェック
      if (videoList[num]) {
        // 動画URLを書き換えて再生
        source.src = videoList[num];
        player.load(); // 新しい動画ファイルを読み込む
        player.play(); // 自動再生
      } else {
        alert("該当する動画がありません。1〜3の数字を入力してください。");
      }
    }
  </script>
</body>
</html>
